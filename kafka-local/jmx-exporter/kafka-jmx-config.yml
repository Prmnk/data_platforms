lowercaseOutputName: true
lowercaseOutputLabelNames: true

rules:
  # ─── REQUEST METRICS ──────────────────────────────────────────────────────
  # Handles Confluent's :value suffix by matching with colon pattern first
  - pattern: 'kafka.network<type=RequestMetrics, name=(\w+), request=(\w+)><>(\w+):'
    name: kafka_network_requestmetrics_$1_$3
    labels:
      request: "$2"
    type: GAUGE

  - pattern: 'kafka.network<type=RequestMetrics, name=(\w+), request=(\w+)><>(\w+)'
    name: kafka_network_requestmetrics_$1_$3
    labels:
      request: "$2"
    type: GAUGE

  # ─── BROKER TOPIC METRICS ─────────────────────────────────────────────────
  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=(\w+), topic=(.+)><>Count'
    name: kafka_server_brokertopicmetrics_$1_total
    labels:
      topic: "$2"
    type: COUNTER

  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=(\w+)><>Count'
    name: kafka_server_brokertopicmetrics_$1_total
    type: COUNTER

  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=(\w+), topic=(.+)><>OneMinuteRate'
    name: kafka_server_brokertopicmetrics_$1_rate
    labels:
      topic: "$2"
    type: GAUGE

  - pattern: 'kafka.server<type=BrokerTopicMetrics, name=(\w+)><>OneMinuteRate'
    name: kafka_server_brokertopicmetrics_$1_rate
    type: GAUGE

  # ─── REPLICA MANAGER ──────────────────────────────────────────────────────
  - pattern: 'kafka.server<type=ReplicaManager, name=(\w+)><>Value'
    name: kafka_server_replicamanager_$1
    type: GAUGE

  - pattern: 'kafka.server<type=ReplicaManager, name=(\w+)><>OneMinuteRate'
    name: kafka_server_replicamanager_$1_per_sec
    type: GAUGE

  # ─── CONTROLLER ───────────────────────────────────────────────────────────
  - pattern: 'kafka.controller<type=KafkaController, name=(\w+)><>Value'
    name: kafka_controller_$1
    type: GAUGE

  - pattern: 'kafka.controller<type=KafkaController, name=(\w+)><>OneMinuteRate'
    name: kafka_controller_$1_per_sec
    type: GAUGE

  # ─── LOG METRICS ──────────────────────────────────────────────────────────
  - pattern: 'kafka.log<type=Log, name=(\w+), topic=(.+), partition=(\d+)><>Value'
    name: kafka_log_$1
    labels:
      topic: "$2"
      partition: "$3"
    type: GAUGE

  # ─── REQUEST HANDLER ──────────────────────────────────────────────────────
  - pattern: 'kafka.server<type=KafkaRequestHandlerPool, name=RequestHandlerAvgIdlePercent><>OneMinuteRate'
    name: kafka_server_request_handler_avg_idle_percent
    type: GAUGE

  # ─── NETWORK PROCESSOR ────────────────────────────────────────────────────
  - pattern: 'kafka.network<type=SocketServer, name=NetworkProcessorAvgIdlePercent><>Value'
    name: kafka_network_socketserver_networkprocessor_avg_idle_percent
    type: GAUGE

  # ─── CONSUMER GROUP COORDINATOR ───────────────────────────────────────────
  - pattern: 'kafka.coordinator.group<type=GroupMetadataManager, name=(\w+)><>Value'
    name: kafka_coordinator_group_$1
    type: GAUGE

  # ─── PRODUCER / TRANSACTION ───────────────────────────────────────────────
  - pattern: 'kafka.server<type=ProducerRequestMetrics, name=(\w+)><>(\w+)'
    name: kafka_server_producerrequestmetrics_$1_$2
    type: GAUGE

  # ─── JVM MEMORY ───────────────────────────────────────────────────────────
  - pattern: 'java.lang<type=Memory><>(\w+)'
    name: jvm_memory_$1
    type: GAUGE

  - pattern: 'java.lang<type=MemoryPool, name=(.+)><>Usage.(\w+)'
    name: jvm_memory_pool_$2
    labels:
      pool: "$1"
    type: GAUGE

  # ─── JVM GC ───────────────────────────────────────────────────────────────
  - pattern: 'java.lang<type=GarbageCollector, name=(.+)><>CollectionCount'
    name: jvm_gc_collection_count_total
    labels:
      gc: "$1"
    type: COUNTER

  - pattern: 'java.lang<type=GarbageCollector, name=(.+)><>CollectionTime'
    name: jvm_gc_collection_time_ms_total
    labels:
      gc: "$1"
    type: COUNTER

  # ─── JVM THREADS ──────────────────────────────────────────────────────────
  - pattern: 'java.lang<type=Threading><>(\w+)'
    name: jvm_threads_$1
    type: GAUGE