apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData: {timeInterval: 5s}

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200

  # Reads the lab API directly (run table with status, args, results).
  - name: lab-api
    uid: lab-api
    type: yesoreyeram-infinity-datasource
    jsonData:
      allowedHosts: ["http://lab-api:8010"]
