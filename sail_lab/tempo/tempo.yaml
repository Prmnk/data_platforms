# Single-process Tempo on the local filesystem. Receives Sail's query traces over OTLP.
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: 0.0.0.0:4317}

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    local: {path: /var/tempo/blocks}
    wal: {path: /var/tempo/wal}

usage_report:
  reporting_enabled: false
