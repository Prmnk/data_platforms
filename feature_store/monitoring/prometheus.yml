global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: flink
    static_configs:
      - targets: ["jobmanager:9249", "taskmanager:9249"]

  - job_name: feature-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: scylla
    static_configs:
      - targets: ["scylla:9180"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
